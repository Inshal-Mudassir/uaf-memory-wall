services:
  - type: web
    name: uaf-memory-wall-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.3 }
      - { key: APP_ENV, value: production }
      - { key: TRUST_PROXY, value: "true" }
      - { key: STORAGE_BACKEND, value: cloudinary }
      - { key: SECRET_SALT, generateValue: true }
      - { key: MONGODB_URI, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: ADMIN_API_KEY, sync: false }
